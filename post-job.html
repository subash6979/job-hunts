<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - JobHunts</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="jobs.html">Jobs</a>
            <a href="companies.html">Companies</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>
    
    <main>
        <h1>Post a Job</h1>
        <form id="post-job-form">
            <div>
                <label for="job-title">Job Title:</label>
                <input type="text" id="job-title" name="job-title" required>
            </div>
            <div>
                <label for="job-description">Job Description:</label>
                <textarea id="job-description" name="job-description" required></textarea>
            </div>
            <div>
                <label for="job-requirements">Requirements:</label>
                <textarea id="job-requirements" name="job-requirements" required></textarea>
            </div>
            <div>
                <label for="company-name">Company Name:</label>
                <input type="text" id="company-name" name="company-name" required>
            </div>
            <div>
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required>
            </div>
            <button type="submit">Post Job</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 JobHunts. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/jobs.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/i18n.js"></script>
</body>
</html>
