<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Set up your JobHunts profile</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body><header><nav><a href="index.html" class="logo"><img src="assets/images/logo.svg" alt="JobHunts Logo"><span>Job Hunts</span></a><span>Profile setup · 1 of 4</span></nav></header>
<main><div style="height:8px;background:#e2e5ea;border-radius:99px;margin-bottom:42px"><div style="height:100%;width:25%;background:#1a56db;border-radius:99px"></div></div><p class="eyebrow">Make your matches better</p><h1>Tell us what you are looking for.</h1><p>We use this to make job recommendations more useful. You can change it anytime.</p><form><div class="form-group"><label for="account-type">I am joining as</label><select id="account-type"><option>Job seeker</option><option>Employer</option></select></div><div class="form-group"><label for="location">Where are you based?</label><input id="location" placeholder="City, state, or ZIP code"></div><div class="form-group"><label for="work-type">What kind of work interests you?</label><select id="work-type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option><option>Internship</option></select></div><div class="form-group"><label for="category">Choose a work category</label><select id="category"><option>Healthcare</option><option>IT &amp; Technology</option><option>Skilled Trades</option><option>Transportation</option><option>Food Service</option><option>Education</option><option>Construction &amp; Labor</option><option>Hospitality &amp; Retail</option><option>Cleaning &amp; Maintenance</option></select></div><button type="button" onclick="window.location.href='jobs.html'">Continue to JobHunts</button></form></main><footer><p>Your profile visibility is private until you choose to be discoverable.</p></footer></body></html>
